name: release

# Builds the release artefacts on a tag so a release stops depending on one laptop having docker,
# the right containers and a populated models/ directory.
#
# The models are the awkward part: they are gitignored (hundreds of MB) and produced by the Python
# toolchain, so the workflow regenerates them rather than expecting them to be checked out.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build the model toolchain and produce the IR
        run: |
          python -m venv tools/.venv
          tools/.venv/bin/pip install --quiet -r tools/requirements.txt
          tools/.venv/bin/python tools/prepare_model.py --model herbert
          tools/.venv/bin/python tools/quantize.py      --model herbert

      - name: Build bundles
        env:
          # Windows DLLs come from the OpenVINO wheel; a wheel is a zip, so no pip needed.
          OV_WINDOWS_LIBS: ${{ github.workspace }}/ovwin/openvino/libs
        run: |
          python - <<'PY'
          import json, urllib.request, zipfile, io, pathlib
          meta = json.load(urllib.request.urlopen("https://pypi.org/pypi/openvino/2026.3.0/json"))
          url = next(u["url"] for u in meta["urls"] if "cp311-cp311-win_amd64" in u["filename"])
          data = urllib.request.urlopen(url).read()
          z = zipfile.ZipFile(io.BytesIO(data))
          z.extractall("ovwin", [n for n in z.namelist() if n.startswith("openvino/libs/")])
          PY
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zip
          ./scripts/make-release.sh "${GITHUB_REF_NAME#v}"

      # One file, no installation, no dependencies. Built from the same staged directory the
      # tarball comes from, so the AppImage and the bundle cannot drift apart.
      - name: Build the AppImage
        run: |
          ./packaging/linux/build-appimage.sh             "dist/sentin-npu-diag-${GITHUB_REF_NAME#v}-linux-x64" "${GITHUB_REF_NAME#v}"

      - name: Checksums
        run: |
          cd dist && sha256sum *.tar.gz *.zip *.AppImage > SHA256SUMS.txt && cat SHA256SUMS.txt

      # dist/*.tar.gz covers three things: the Linux bundle and the two standalone IR archives
      # that make-release.sh produces alongside it (sentin-npu-model-herbert-int8-seq*.tar.gz).
      # The model archives are named without a version so that a
      # releases/latest/download/<name> URL keeps working; SHA256SUMS.txt pins them per release.
      #
      # `prerelease: false` is load-bearing, not a claim of maturity -- the 0.0.0.x version and the
      # README's status banner do that job. GitHub excludes prereleases from `latest`, so while
      # every release was flagged as one, every releases/latest/download/... URL in the README
      # returned 404, including the versionless model URLs that exist precisely to be stable.
      # The scheme only works if some release is actually the latest one.
      #
      # generate_release_notes fills the body with the commit range. The title and a hand-written
      # summary still get added afterwards (gh release edit), but an empty release is no longer
      # what happens when that step is forgotten.
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/SHA256SUMS.txt
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true

  # The installer needs a Windows runner: Inno Setup's compiler does not cross-build. It takes the
  # bundle the job above already published rather than rebuilding anything, so the installer and
  # the zip carry byte-identical binaries.
  installer:
    needs: bundles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the Windows bundle from the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern "*windows-x64.zip" --dir dist
          cd dist && unzip -q "sentin-npu-diag-${VERSION}-windows-x64.zip"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: bash
        env:
          # Git Bash rewrites an argument that starts with a slash into a Windows path, so ISCC
          # would receive a mangled /DVersion and refuse it as a second script filename.
          MSYS_NO_PATHCONV: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe"             "/DVersion=$VERSION"             "/DPayload=$(pwd -W)/dist/sentin-npu-diag-${VERSION}-windows-x64"             packaging/windows/sentin-npu.iss
          ls -la packaging/windows/out/

      # The checksum file is written by the job above and cannot know about an asset built here,
      # so it is amended rather than left incomplete: every asset in a release should be verifiable
      # the same way, and an installer is the one people run without reading.
      - name: Checksum and upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SETUP="packaging/windows/out/sentin-npu-setup-${VERSION}.exe"
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --dir sums
          ( cd "$(dirname "$SETUP")" && sha256sum "$(basename "$SETUP")" ) >> sums/SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" "$SETUP" --clobber
          gh release upload "$GITHUB_REF_NAME" sums/SHA256SUMS.txt --clobber
