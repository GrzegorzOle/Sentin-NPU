<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540"
     role="img" aria-labelledby="title desc">
  <title id="title">Sentin-NPU architecture</title>
  <desc id="desc">An LLM agent sends its request to the Sentin-NPU gateway running on the same
    machine. The gateway inspects the request in four stages — deterministic checksum detectors,
    NER inference on the NPU through OpenVINO, a policy decision, and an audit event — then
    forwards the masked request to the LLM provider. Detected content never leaves the machine;
    only metadata reaches the SIEM.</desc>

  <!-- Deliberately a light-background diagram: GitHub's dark theme does not follow the OS
       colour-scheme preference reliably, so a media query here would misfire more often than
       it would help. -->
  <rect width="960" height="540" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41556b"/>
    </marker>
    <style>
      .lbl   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .h     { font-size: 17px; font-weight: 650; fill: #17212b; }
      .h2    { font-size: 14px; font-weight: 650; fill: #17212b; }
      .t     { font-size: 13px; fill: #33465a; }
      .s     { font-size: 12px; fill: #61748a; }
      .step  { font-size: 13px; fill: #17212b; }
      .num   { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .edge  { font-size: 12px; fill: #41556b; }
    </style>
  </defs>

  <!-- trust boundary -->
  <rect x="24" y="26" width="606" height="392" rx="14"
        fill="#f8fafc" stroke="#9fb3c8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="lbl s" x="44" y="50">your machine — nothing here leaves the device for inspection</text>

  <!-- agent -->
  <rect x="48" y="112" width="168" height="150" rx="10"
        fill="#ffffff" stroke="#7d93aa" stroke-width="1.5"/>
  <text class="lbl h2" x="132" y="146" text-anchor="middle">LLM agent</text>
  <text class="lbl t"  x="132" y="172" text-anchor="middle">Claude SDK</text>
  <text class="lbl t"  x="132" y="192" text-anchor="middle">Gemini SDK</text>
  <text class="lbl t"  x="132" y="212" text-anchor="middle">Ollama, vLLM, …</text>
  <text class="lbl s"  x="132" y="240" text-anchor="middle">base_url → localhost:4141</text>

  <!-- gateway -->
  <rect x="266" y="74" width="340" height="306" rx="12"
        fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <text class="lbl h"  x="436" y="106" text-anchor="middle">Sentin-NPU gateway</text>
  <text class="lbl s"  x="436" y="126" text-anchor="middle">Rust · tokio · axum</text>

  <g>
    <circle cx="298" cy="164" r="11" fill="#1f4e79"/>
    <text class="lbl num"  x="298" y="168" text-anchor="middle">1</text>
    <text class="lbl step" x="318" y="160">Deterministic layer</text>
    <text class="lbl s"    x="318" y="178">PESEL · NIP · REGON · IBAN · cards</text>
  </g>
  <g>
    <circle cx="298" cy="220" r="11" fill="#0068b5"/>
    <text class="lbl num"  x="298" y="224" text-anchor="middle">2</text>
    <text class="lbl step" x="318" y="216">NER — OpenVINO IR</text>
    <text class="lbl s"    x="318" y="234">NPU first, GPU / CPU fallback</text>
  </g>
  <g>
    <circle cx="298" cy="276" r="11" fill="#1f4e79"/>
    <text class="lbl num"  x="298" y="280" text-anchor="middle">3</text>
    <text class="lbl step" x="318" y="272">Policy</text>
    <text class="lbl s"    x="318" y="290">advise · mask · block</text>
  </g>
  <g>
    <circle cx="298" cy="332" r="11" fill="#1f4e79"/>
    <text class="lbl num"  x="298" y="336" text-anchor="middle">4</text>
    <text class="lbl step" x="318" y="328">Audit event</text>
    <text class="lbl s"    x="318" y="346">metadata and a hash, never content</text>
  </g>

  <!-- provider -->
  <rect x="712" y="112" width="216" height="150" rx="10"
        fill="#ffffff" stroke="#7d93aa" stroke-width="1.5"/>
  <text class="lbl h2" x="820" y="146" text-anchor="middle">LLM provider</text>
  <text class="lbl t"  x="820" y="172" text-anchor="middle">api.anthropic.com</text>
  <text class="lbl t"  x="820" y="192" text-anchor="middle">generativelanguage.googleapis.com</text>
  <text class="lbl t"  x="820" y="212" text-anchor="middle">localhost:11434 · any OpenAI API</text>

  <!-- SIEM -->
  <rect x="712" y="330" width="216" height="96" rx="10"
        fill="#ffffff" stroke="#7d93aa" stroke-width="1.5"/>
  <text class="lbl h2" x="820" y="364" text-anchor="middle">SIEM</text>
  <text class="lbl t"  x="820" y="390" text-anchor="middle">Wazuh · Elastic · Splunk</text>
  <text class="lbl s"  x="820" y="410" text-anchor="middle">CEF / OTLP / JSONL</text>

  <!-- edges -->
  <line x1="216" y1="187" x2="258" y2="187" stroke="#41556b" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl edge" x="237" y="176" text-anchor="middle">HTTP</text>

  <line x1="606" y1="187" x2="704" y2="187" stroke="#41556b" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl edge" x="655" y="176" text-anchor="middle">masked request</text>
  <text class="lbl s"    x="655" y="206" text-anchor="middle">+ SSE response</text>

  <path d="M 606 332 L 660 332 L 660 372 L 704 372"
        fill="none" stroke="#41556b" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl edge" x="640" y="322" text-anchor="middle">metadata only</text>

  <text class="lbl s" x="436" y="470" text-anchor="middle">
    Detection runs on the device. The identifier itself is never sent anywhere — not to the
    provider, not to the SIEM.
  </text>
  <text class="lbl s" x="436" y="494" text-anchor="middle">
    Only a checksum-proven match may block; everything else advises or masks, and the user decides.
  </text>
</svg>
