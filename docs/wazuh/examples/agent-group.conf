  EN - centralized configuration for a group, pushed from the manager. This is the form to prefer
  for anything past a couple of machines, and the only form available where you cannot edit the
  agent's own ossec.conf - on Windows, that means any machine where you do not have local
  administrator rights.

  Install it on the MANAGER as:

      /var/ossec/etc/shared/sentin-npu/agent.conf

  PL - konfiguracja centralna dla grupy, rozsyłana z managera. To forma zalecana wszędzie poza
  pojedynczymi maszynami i jedyna dostępna tam, gdzie nie można edytować ossec.conf agenta - na
  Windows oznacza to każdą maszynę bez lokalnych uprawnień administratora.

  Plik instaluje się na MANAGERZE jako:

      /var/ossec/etc/shared/sentin-npu/agent.conf

  ---

  EN - note the wrapper. A group file uses <agent_config>, NOT the <ossec_config> that belongs in an
  agent's own file. The os attribute lets one group serve a mixed fleet: each agent applies only the
  block matching its platform, so a Windows path is never pushed at a Linux machine.

  PL - zwróć uwagę na nagłówek. Plik grupy używa <agent_config>, a NIE <ossec_config>, który należy
  do własnego pliku agenta. Atrybut os pozwala jednej grupie obsłużyć mieszaną flotę: agent stosuje
  wyłącznie blok pasujący do swojej platformy, więc windowsowa ścieżka nigdy nie trafi na Linuksa.

  ---

  EN - after installing it:

      sudo chown wazuh:wazuh /var/ossec/etc/shared/sentin-npu/agent.conf
      sudo chmod 660 /var/ossec/etc/shared/sentin-npu/agent.conf
      sudo /var/ossec/bin/verify-agent-conf
      sudo /var/ossec/bin/agent_control -R -u <AGENT_ID>

  That last line is not an optimisation, it is the step. The agent downloads the new shared
  configuration within a minute and then goes on following the OLD file until it restarts, while
  reporting zero events and zero drops - which is indistinguishable from a quiet system.

  PL - po zainstalowaniu pliku:

      sudo chown wazuh:wazuh /var/ossec/etc/shared/sentin-npu/agent.conf
      sudo chmod 660 /var/ossec/etc/shared/sentin-npu/agent.conf
      sudo /var/ossec/bin/verify-agent-conf
      sudo /var/ossec/bin/agent_control -R -u <ID_AGENTA>

  Ostatnia linia nie jest przyspieszeniem, tylko krokiem procedury. Agent pobierze nową konfigurację
  w ciągu minuty, po czym dalej będzie śledził STARY plik aż do restartu, raportując zero zdarzeń i
  zero strat - czyli dokładnie to samo, co spokojny system.

  ---

  EN - do not leave a backup beside this file in the group directory. The manager merges EVERY file
  in /var/ossec/etc/shared/<group>/ into merged.mg, so agent.conf.bak is not a backup: it is a
  second live configuration, and the agent will collect both paths. Keep backups outside the group.

  PL - nie zostawiaj kopii zapasowej obok tego pliku w katalogu grupy. Manager scala KAŻDY plik z
  /var/ossec/etc/shared/<grupa>/ do merged.mg, więc agent.conf.bak nie jest kopią zapasową, tylko
  drugą działającą konfiguracją - agent będzie zbierał obie ścieżki. Kopie trzymaj poza grupą.
-->

<agent_config os="Linux">
  <localfile>
    <location>/var/log/sentin-npu/audit.jsonl</location>
    <log_format>json</log_format>
  </localfile>
</agent_config>

<agent_config os="Windows">
  <localfile>
    <location>C:\ProgramData\Sentin-NPU\audit.jsonl</location>
    <log_format>json</log_format>
  </localfile>
</agent_config>
