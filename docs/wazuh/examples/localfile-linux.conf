  EN - Linux agent, single machine.
  Paste the <localfile> block below (the block itself, not this comment) inside <ossec_config> in
  /var/ossec/etc/ossec.conf, then restart the agent:

      sudo systemctl restart wazuh-agent

  PL - agent na Linuksie, pojedyncza maszyna.
  Wklej poniższy blok <localfile> (sam blok, nie ten komentarz) wewnątrz <ossec_config> w pliku
  /var/ossec/etc/ossec.conf, a następnie zrestartuj agenta:

      sudo systemctl restart wazuh-agent

  ---

  EN - two paths are in use, depending on how the gateway was installed. Take the one that matches
  audit.jsonl.path in the gateway's config.yaml rather than the one that looks familiar:

      installed by scripts/install.sh, system service    /var/log/sentin-npu/audit.jsonl
      AppImage --install-service, systemd user unit      ~/.local/state/sentin-npu/audit.jsonl

  PL - w użyciu są dwie ścieżki, zależnie od sposobu instalacji bramy. Weź tę, która zgadza się z
  audit.jsonl.path w config.yaml bramy, a nie tę, która wygląda znajomo:

      instalacja przez scripts/install.sh, usługa systemowa   /var/log/sentin-npu/audit.jsonl
      AppImage --install-service, jednostka systemd usera     ~/.local/state/sentin-npu/audit.jsonl

  ---

  EN - the agent runs as root, so a path under /home is normally readable. An encrypted or
  automounted home directory is the exception: it does not exist until that user logs in, and the
  collector will report the file as missing rather than as empty.

  PL - agent działa jako root, więc ścieżka w katalogu domowym jest zwykle czytelna. Wyjątkiem jest
  katalog zaszyfrowany lub montowany automatycznie: przed zalogowaniem użytkownika po prostu nie
  istnieje, a kolektor zgłosi brak pliku, nie plik pusty.
-->

<ossec_config>
  <localfile>
    <location>/var/log/sentin-npu/audit.jsonl</location>
    <log_format>json</log_format>
  </localfile>
</ossec_config>
