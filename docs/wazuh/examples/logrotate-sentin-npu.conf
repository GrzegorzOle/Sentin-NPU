#
# EN - Linux rotation for the gateway's audit trail. Install as /etc/logrotate.d/sentin-npu.
# The gateway appends and never rotates, so without something like this the file grows without
# bound on a busy machine.
#
# PL - rotacja śladu audytowego bramy na Linuksie. Instaluje się jako /etc/logrotate.d/sentin-npu.
# Brama tylko dopisuje i nigdy nie rotuje, więc bez czegoś takiego plik rośnie bez ograniczeń na
# obciążonej maszynie.
#
# ---
#
# EN - copytruncate is the setting that matters, and it is not a preference. Wazuh's log collector
# follows a truncation in place and carries on from offset zero. A rename-and-recreate also works,
# but the events written between the rename and the reopen are lost, and they are lost silently -
# which is the one failure mode this whole integration exists to avoid.
#
# PL - copytruncate to ustawienie, które tu decyduje, i nie jest kwestią gustu. Kolektor Wazuha
# śledzi obcięcie pliku w miejscu i kontynuuje od pozycji zero. Przeniesienie i utworzenie na nowo
# też działa, ale zdarzenia zapisane pomiędzy przeniesieniem a ponownym otwarciem przepadają - i to
# po cichu, czyli w dokładnie ten sposób, przed którym ta integracja ma chronić.
#
# ---
#
# EN - the path must match audit.jsonl.path in the gateway's config.yaml. For the AppImage's user
# service the trail is under ~/.local/state/sentin-npu/, which logrotate run from cron as root can
# read but which is better rotated from the user's own systemd timer.
#
# PL - ścieżka musi zgadzać się z audit.jsonl.path w config.yaml bramy. Przy usłudze użytkownika z
# AppImage ślad leży w ~/.local/state/sentin-npu/ - logrotate uruchamiany z crona jako root to
# odczyta, ale lepiej rotować go własnym timerem systemd tego użytkownika.

/var/log/sentin-npu/audit.jsonl {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}
