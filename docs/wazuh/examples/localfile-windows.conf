  EN - Windows agent, single machine.
  Paste the <localfile> block below (the block itself, not this comment) inside <ossec_config> in
  the agent's own configuration file:

      C:\Program Files (x86)\ossec-agent\ossec.conf

  then restart the agent from an elevated console:

      Restart-Service WazuhSvc

  PL - agent na Windows, pojedyncza maszyna.
  Wklej poniższy blok <localfile> (sam blok, nie ten komentarz) wewnątrz <ossec_config> w pliku
  konfiguracyjnym agenta:

      C:\Program Files (x86)\ossec-agent\ossec.conf

  a następnie zrestartuj agenta z konsoli uruchomionej jako administrator:

      Restart-Service WazuhSvc

  ---

  EN - the path below is the one the Windows installer writes into config.yaml. If a different one
  was given in the wizard, read audit.jsonl.path out of C:\ProgramData\Sentin-NPU\config.yaml and
  use that instead. The two must match exactly: nothing compares them for you, and a mismatch
  collects nothing while looking configured.

  PL - poniższa ścieżka jest tą, którą instalator wpisuje do config.yaml. Jeśli w kreatorze podano
  inną, odczytaj audit.jsonl.path z C:\ProgramData\Sentin-NPU\config.yaml i użyj jej. Obie muszą być
  identyczne: nic ich za Ciebie nie porównuje, a rozjazd nie zbiera niczego, wyglądając przy tym na
  poprawnie skonfigurowany.
-->

<ossec_config>
  <localfile>
    <location>C:\ProgramData\Sentin-NPU\audit.jsonl</location>
    <log_format>json</log_format>
  </localfile>
</ossec_config>
