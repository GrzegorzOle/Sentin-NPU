<!--
  Sentin-NPU audit events -> Wazuh agent.

  Add ONE of the blocks below to the agent's ossec.conf, inside <ossec_config>, or push it to a
  group as agent.conf (see README.md, "Option B"). Paths must match audit.jsonl.path in the
  gateway's config.yaml. Use an absolute path in both places: a relative one resolves against the
  gateway's working directory and will silently collect nothing.

  log_format is json because the gateway writes one JSON object per line. Wazuh's own JSON decoder
  then exposes every field as data.<name>, which is why this integration ships rules but no
  decoder: there is nothing to parse.
-->

<!-- Linux, default install path -->
<ossec_config>
  <localfile>
    <location>/var/log/sentin-npu/audit.jsonl</location>
    <log_format>json</log_format>
  </localfile>
</ossec_config>

<!-- Windows. Backslashes, and the drive letter as the gateway writes it. -->
<ossec_config>
  <localfile>
    <location>C:\ProgramData\sentin-npu\audit.jsonl</location>
    <log_format>json</log_format>
  </localfile>
</ossec_config>

<!--
  Rotation: the gateway appends and never rotates. Point logrotate (Linux) or your own scheduled
  task (Windows) at the file. Wazuh's logcollector follows a truncation, so copytruncate is safe;
  a rename-and-recreate is also handled, at the cost of the events written between the two.
-->
