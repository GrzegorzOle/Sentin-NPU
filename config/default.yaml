#
# Default gateway configuration. Phase 0 shape - keys are the contract the Rust
# crates will deserialize; most are not read yet.

# Port 4141 rather than the more obvious 4000: LiteLLM, the usual model router in this kind of
# setup, listens on 4000, and a gateway that will not start because something else holds its port
# is a poor first impression.
listen:
  host: 127.0.0.1
  port: 4141

# Upstreams per adapter prefix. The caller's API key is forwarded verbatim and never logged.
providers:
  anthropic:
    prefix: /anthropic
    upstream: https://api.anthropic.com
  # Any OpenAI-compatible upstream: a model router such as LiteLLM (default below), or Ollama
  # directly on http://localhost:11434, or LM Studio / vLLM. The caller's API key is forwarded
  # unchanged, so the gateway needs no credentials of its own for any of them.
  openai:
    prefix: /openai
    upstream: http://localhost:4000
  google:
    prefix: /google
    upstream: https://generativelanguage.googleapis.com

inference:
  # NPU | GPU | CPU | AUTO. Naming a device pins it; AUTO measures.
  #
  # AUTO used to walk a fixed NPU > GPU > CPU order, which is right on an Intel laptop and wrong
  # anywhere else: on a desktop with a discrete NVIDIA card reachable through the OpenCL ICD it
  # picked that card at 224.8 ms per inference over the CPU beside it at 8.7 ms, and blew the
  # latency budget doing it. AUTO now compiles and times the model on every enumerated device,
  # rejects anything slower than max_inference_ms, and prefers among the rest by `select`.
  # The result is cached (see SENTIN_CACHE_DIR); SENTIN_DEVICE_PROBE=force re-measures.
  device: AUTO
  # What AUTO optimises for once every device has proven it meets the ceiling:
  #   cost    - the cheaper accelerator first: NPU, integrated GPU, CPU, discrete GPU last.
  #             Backed by measurement: on a Core Ultra 7 258V at 10 rps the NPU costs 78.21 mJ
  #             per inference against the iGPU's 160.08, so at equal latency it is the right
  #             answer by a factor of two. The default.
  #   latency - simply the fastest measured device.
  select: cost
  # The measured steady-state inference a device must beat to be preferred, in milliseconds.
  # 80 ms is the NPU budget from M2b: below it a device is behaving like an accelerator.
  # This rejects relative to a working alternative - if nothing on the machine is under it, the
  # fastest device is used anyway and the gateway says so. It never switches layer 2 off.
  max_inference_ms: 80
  # The directory holding the IR and its tokenizer.json, not the models/ root: this is the path
  # the toolchain writes for the shorter shape variant. Pointing it one level too high loads
  # nothing and drops the gateway to layer 1 with only a warning, which is easy to miss.
  # install.sh rewrites this to an absolute path, because a relative one resolves against the
  # working directory and would silently disable layer 2 from anywhere but the install root.
  model_dir: models/herbert/int8/seq128
  # Two static-shape IR variants; the shorter one is preferred when the text fits.
  sequence_lengths: [128, 512]
  # If inspection exceeds this, apply timeout_policy and emit inspection_timeout.
  timeout_ms: 250
  # fail_open forwards the request uninspected; fail_closed refuses it.
  # PoC default is fail_open - advisory-first: the gateway must not break the agent.
  timeout_policy: fail_open

# Per-detector verdict ceiling. `block` is only honoured for layer-1 detectors;
# the policy engine clamps anything higher (see sentin_core::Layer::max_decision).
detectors:
  pesel:        { layer: deterministic, mode: block }
  nip:          { layer: deterministic, mode: mask }
  regon:        { layer: deterministic, mode: mask }
  iban:         { layer: deterministic, mode: block }
  payment_card: { layer: deterministic, mode: block }
  email:        { layer: deterministic, mode: advise }
  phone_pl:     { layer: deterministic, mode: advise }
  person:       { layer: ner, mode: advise }
  organization: { layer: ner, mode: advise }
  location:     { layer: ner, mode: observe }

# Request-side inspection is the threat model - data leaving the device - and costs +0.07 ms p95.
#
# stream_strategy decides how a streamed response is inspected (research question B2, closed):
#   passthrough    - request-side only. +0.1 ms to first token. The PoC default.
#   sliding_window - inspect at sentence boundaries. Costs ~one sentence (+92 ms measured),
#                    bounded regardless of how long the answer is.
#   buffer         - hold the whole response, then emit. Its penalty *is* the generation time
#                    (+511 ms on a 0.5 s answer, ~24 s on a 2000-token one). Not recommended.
# Numbers and reasoning: docs/benchmarks.md.
inspect:
  request: true
  response: false
  stream_strategy: passthrough

audit:
  jsonl:
    enabled: true
    path: ./sentin-audit.jsonl
  syslog_cef:
    enabled: false
    address: 127.0.0.1:514
    protocol: udp
  otlp:
    enabled: false
    # OTLP over **HTTP with JSON encoding**, so this is the collector's HTTP port (4318), not the
    # gRPC one (4317). `/v1/logs` is appended if the endpoint does not already end in it. Pointing
    # this at 4317 posts JSON at a gRPC listener and every event is dropped.
    endpoint: http://localhost:4318
