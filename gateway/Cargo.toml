[workspace]
resolver = "2"
members = [
    "crates/sentin-core",
    "crates/sentin-diag",
    "crates/sentin-detect",
    "crates/sentin-proxy",
    "crates/sentin-audit",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/GrzegorzOle/Sentin-NPU"
authors = ["Grzegorz Oleksy"]

[workspace.dependencies]
sentin-core = { path = "crates/sentin-core" }
sentin-detect = { path = "crates/sentin-detect" }
sentin-diag = { path = "crates/sentin-diag" }
sentin-proxy = { path = "crates/sentin-proxy" }
sentin-audit = { path = "crates/sentin-audit" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "http2",
    "rustls",
    "rustls-native-certs",
] }
futures-util = "0.3"
bytes = "1"
# serde_yaml is archived upstream; serde_yaml_ng is the maintained fork.
serde_yaml_ng = "0.10"
# runtime-linking: dlopen at startup, so no OpenVINO installation is needed to *build*.
openvino = { version = "0.11", features = ["runtime-linking"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

proptest = "1"
criterion = "0.7"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
